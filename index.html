    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = 'gra-inwestor-2026';

        // Twoje unikalne klucze do projektu "gra-prawdopodobienstwo"
        const firebaseConfig = {
            apiKey: "AIzaSyCX_bN-3anfuyxB2icwEKhwl6j1Kc-cw78",
            authDomain: "gra-prawdopodobienstwo.firebaseapp.com",
            projectId: "gra-prawdopodobienstwo",
            storageBucket: "gra-prawdopodobienstwo.firebasestorage.app",
            messagingSenderId: "985313632076",
            appId: "1:985313632076:web:3c5fd729f92ec43de179e9",
            measurementId: "G-22QWGFL37H"
        };

        let app, db, auth, currentUser;
        
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Błąd inicjalizacji Firebase:", e);
            alert("Błąd połączenia z bazą danych. Sprawdź konfigurację.");
        }

        const views = document.querySelectorAll('.view-section');
        const loader = document.getElementById('loader');
        
        let isHost = false;
        let localPlayerId = null;
        let currentGameState = null;
        let playersData = [];
        let timerInterval = null;
        let capitalChartInstance = null;

        const getGameStateRef = () => doc(db, 'gry', appId, 'dane', 'stanGry');
        const getPlayersRef = () => collection(db, 'gry', appId, 'gracze');
        const getPlayerRef = (uid) => doc(db, 'gry', appId, 'gracze', uid);

        function showLoader() { loader.classList.remove('hidden'); }
        function hideLoader() { loader.classList.add('hidden'); }
        
        function switchView(viewId) {
            views.forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function authenticate() {
            showLoader();
            try {
                // Logowanie anonimowe
                await signInAnonymously(auth);
                currentUser = auth.currentUser;
                localPlayerId = currentUser.uid;
            } catch (error) {
                console.error("Błąd autoryzacji:", error);
                alert("Błąd logowania. Upewnij się, że włączyłeś 'Logowanie anonimowe' w Firebase. Szukaj w konsoli (F12) więcej szczegółów.");
            }
            hideLoader();
        }

        async function initHost() {
            await authenticate();
            if (!currentUser) return;
            isHost = true;
            
            const stateRef = getGameStateRef();
            const snap = await getDoc(stateRef);
            if (!snap.exists()) {
                await setDoc(stateRef, {
                    round: 1,
                    bettingOpen: false,
                    endTime: null,
                    lastResult: null
                });
            }
            
            initChart();
            listenToGameState();
            listenToPlayers();
            switchView('view-host-dashboard');
        }

        async function initPlayerJoin() {
            await authenticate();
            if (!currentUser) return;
            switchView('view-player-join');
        }

        async function joinGame() {
            const teamName = document.getElementById('input-team-name').value.trim();
            if (!teamName) {
                const input = document.getElementById('input-team-name');
                input.classList.add('border-red-500');
                setTimeout(() => input.classList.remove('border-red-500'), 2000);
                return;
            }

            showLoader();
            try {
                await setDoc(getPlayerRef(localPlayerId), {
                    teamName: teamName,
                    capital: 1000,
                    currentBet: 0,
                    history: [1000],
                    hasBet: false
                });
                
                document.getElementById('player-team-display').innerText = teamName;
                listenToGameState();
                listenToLocalPlayer();
                switchView('view-player-dashboard');
            } catch (e) {
                console.error("Błąd dołączania", e);
                alert("Błąd bazy danych (prawdopodobnie reguły Firestore blokują zapis).");
            }
            hideLoader();
        }

        function listenToGameState() {
            onSnapshot(getGameStateRef(), (docSnap) => {
                if (docSnap.exists()) {
                    currentGameState = docSnap.data();
                    updateUIFromGameState();
                }
            }, (err) => console.error("Błąd nasłuchu stanu gry", err));
        }

        function listenToPlayers() {
            onSnapshot(getPlayersRef(), (snapshot) => {
                playersData = [];
                snapshot.forEach(doc => {
                    playersData.push({ id: doc.id, ...doc.data() });
                });
                
                playersData.sort((a, b) => b.capital - a.capital);
                
                if (isHost) {
                    updateHostPlayersTable();
                    updateChart();
                }
            }, (err) => console.error("Błąd nasłuchu graczy", err));
        }

        function listenToLocalPlayer() {
            onSnapshot(getPlayerRef(localPlayerId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const capDisplay = document.getElementById('player-capital-display');
                    
                    if (capDisplay.innerText !== data.capital.toString()) {
                        capDisplay.classList.add('scale-110', 'text-yellow-400');
                        setTimeout(() => capDisplay.classList.remove('scale-110', 'text-yellow-400'), 500);
                    }
                    capDisplay.innerText = data.capital;
                    
                    const betInput = document.getElementById('input-bet-amount');
                    betInput.max = data.capital;
                    
                    const betSection = document.getElementById('player-bet-section');
                    const statusBanner = document.getElementById('player-status-banner');
                    
                    if (data.hasBet && currentGameState?.bettingOpen) {
                        betSection.classList.add('opacity-50', 'pointer-events-none');
                        statusBanner.innerText = `Postawiono: ${data.currentBet}. Oczekiwanie na koniec rundy...`;
                        statusBanner.className = "bg-emerald-900/50 text-emerald-200 border border-emerald-700 p-4 rounded-xl text-center font-medium";
                    }
                }
            }, (err) => console.error("Błąd nasłuchu gracza", err));
        }

            const isFinished = r > 16;

            document.getElementById('host-round-display').innerText = `Runda ${Math.min(r, 16)}/16`;

            manageTimer();

            if (isHost) {
                const btnStart = document.getElementById('btn-host-start');
                const btnResolve = document.getElementById('btn-host-resolve');
                const statusTxt = document.getElementById('host-status-text');

                if (isFinished) {
                    btnStart.disabled = true;
                    btnResolve.disabled = true;
                    statusTxt.innerText = "GRA ZAKOŃCZONA";
                } else if (currentGameState.bettingOpen) {
                    btnStart.disabled = true;
                    btnResolve.disabled = true;
                    statusTxt.innerText = "Obstawianie w toku...";
                    statusTxt.classList.replace('text-slate-400', 'text-green-400');
                } else {
                    statusTxt.classList.replace('text-green-400', 'text-slate-400');
                    if (currentGameState.endTime !== null && currentGameState.endTime <= Date.now() + 2000) {
                        btnStart.disabled = true;
                        btnResolve.disabled = false;
                        btnResolve.classList.add('animate-pulse');
                        statusTxt.innerText = "Czas minął. Rozlicz rundę!";
                    } else {
                        btnStart.disabled = false;
                        btnResolve.disabled = true;
                        btnResolve.classList.remove('animate-pulse');
                        statusTxt.innerText = "Oczekiwanie na start rundy";
                    }
                }

                const hostResultBox = document.getElementById('host-last-result');
                const hostResultText = document.getElementById('host-last-result-text');
                if (currentGameState.lastResult) {
                    hostResultBox.classList.remove('hidden');
                    if (currentGameState.lastResult === 'WIN') {
                        hostResultText.innerText = "ZYSK (+2x)";
                        hostResultText.className = "text-3xl font-black uppercase tracking-wider text-emerald-400";
                        hostResultBox.className = "bg-slate-800 p-6 rounded-2xl shadow-xl text-center border-2 border-emerald-900";
                    } else {
                        hostResultText.innerText = "STRATA (-1x)";
                        hostResultText.className = "text-3xl font-black uppercase tracking-wider text-red-500";
                        hostResultBox.className = "bg-slate-800 p-6 rounded-2xl shadow-xl text-center border-2 border-red-900";
                    }
                }
            } else {
