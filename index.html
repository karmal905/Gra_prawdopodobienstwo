<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra Inwestycyjna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-800 p-4 shadow-md text-center">
        <h1 class="text-3xl font-bold text-blue-400 uppercase tracking-widest">Inwestor 2026</h1>
    </header>

    <main class="flex-grow p-4 flex items-center justify-center relative">
        
        <div id="view-role-select" class="view-section flex flex-col items-center gap-6 w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl">
            <h2 class="text-2xl font-semibold mb-4 text-center">Wybierz swoją rolę</h2>
            <button id="btn-role-host" class="w-full py-4 bg-purple-600 hover:bg-purple-500 transition rounded-xl font-bold text-xl shadow-[0_0_15px_rgba(147,51,234,0.5)]">
                Jestem Prezenterem
            </button>
            <button id="btn-role-player" class="w-full py-4 bg-blue-600 hover:bg-blue-500 transition rounded-xl font-bold text-xl shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                Jestem Graczem
            </button>
        </div>

        <div id="view-player-join" class="view-section hidden flex flex-col items-center gap-4 w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl">
            <h2 class="text-2xl font-semibold mb-2">Dołącz do gry</h2>
            <input type="text" id="input-team-name" placeholder="Nazwa Twojej drużyny" class="w-full p-4 rounded-xl bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500 text-lg text-center" maxlength="20">
            <button id="btn-join-game" class="w-full py-4 bg-blue-600 hover:bg-blue-500 transition rounded-xl font-bold text-xl mt-4">
                Wejdź do gry
            </button>
            <button onclick="switchView('view-role-select')" class="text-sm text-slate-400 hover:text-white mt-2">Wróć</button>
        </div>

        <div id="view-player-dashboard" class="view-section hidden w-full max-w-lg bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl flex flex-col gap-6">
            <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                <div>
                    <p class="text-sm text-slate-400">Drużyna</p>
                    <h2 id="player-team-display" class="text-2xl font-bold text-blue-400">---</h2>
                </div>
                <div class="text-right">
                    <p class="text-sm text-slate-400">Runda</p>
                    <h2 id="player-round-display" class="text-xl font-bold text-white">1 / 16</h2>
                </div>
            </div>

            <div class="bg-slate-700 p-6 rounded-xl text-center shadow-inner relative overflow-hidden">
                <p class="text-sm text-slate-300 mb-1">Twój Kapitał</p>
                <h3 id="player-capital-display" class="text-5xl font-extrabold text-emerald-400">1000</h3>
            </div>

            <div id="player-status-banner" class="bg-blue-900/50 text-blue-200 border border-blue-700 p-4 rounded-xl text-center font-medium animate-pulse">
                Oczekiwanie na start rundy...
            </div>

            <div id="player-bet-section" class="flex flex-col gap-4 opacity-50 pointer-events-none transition-opacity duration-300">
                <div class="flex flex-col gap-2">
                    <label class="text-sm text-slate-400">Kwota do postawienia (Stawka)</label>
                    <input type="number" id="input-bet-amount" placeholder="0" min="0" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-600 focus:outline-none focus:border-emerald-500 text-2xl text-center font-bold">
                </div>
                <button id="btn-submit-bet" class="w-full py-4 bg-emerald-600
